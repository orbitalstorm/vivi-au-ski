name: vivi_au_ski
description: "VIVI AU SKI : Descente Royale 3D v1.3.0 — Simulation de ski 3D Cartoon Flutter (Android & iOS) dotée d'un vrai moteur de rendu 3D volumétrique temps réel & rig squelettique articulé 22+ os (BLENDER_LAB : Speedy v03, Wonderland, Giant Denim), sauts 3D 360° & périlleux et télésièges obliques infinis."
publish_to: 'none'

version: 1.3.0+4

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sprites/
    - assets/turntable/
    - assets/cartoon/
