name: vivi_au_ski
description: "VIVI AU SKI : Descente Royale 3D v1.5.1 — Simulation de ski 3D Cartoon Flutter (Android & iOS) dotée d'un moteur 3D volumétrique temps réel & rig 22+ os (BLENDER_LAB : Speedy v03, Wonderland, Giant Denim), suppression totale des microbosses en dos d'âne au profit exclusif de larges bosses 3D intégrées à la piste (8/12/16) et de tremplins fondus, Vivienne au-dessus des rampes, matelas sapins orange et village alpin."
publish_to: 'none'

version: 1.5.1+7

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sprites/
    - assets/turntable/
    - assets/cartoon/
