name: vivi_au_ski
description: "VIVI AU SKI : Descente Royale 3D v1.2.0 — Simulation de ski 3D Cartoon Flutter (Android & iOS) mettant en scène les 3 modèles 3D Cycles officiels Vivienne (BLENDER_LAB : Speedy v03, Wonderland, Giant Denim), sauts bonus 360° & périlleux, télésièges obliques infinis et parallaxe continue."
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sprites/
    - assets/turntable/
    - assets/cartoon/
