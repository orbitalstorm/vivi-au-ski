name: vivi_au_ski
description: "VIVI AU SKI : Descente Royale 3D v1.4.0 — Simulation de ski 3D Cartoon Flutter (Android & iOS) dotée d'un vrai moteur 3D volumétrique temps réel & rig 22+ os sans cycle de marche (BLENDER_LAB : Speedy v03, Wonderland, Giant Denim), relief alpin à cassures de pente occultantes, bosses 3D intégrées, 3 tailles de tremplins, mode Slalom Complet et spectateurs Vivienne 3D."
publish_to: 'none'

version: 1.4.0+5

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sprites/
    - assets/turntable/
    - assets/cartoon/
