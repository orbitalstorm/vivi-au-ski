<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="blackDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37474F" />
      <stop offset="45%" stop-color="#141E28" />
      <stop offset="100%" stop-color="#05080C" />
    </linearGradient>
    <linearGradient id="ebonyFacetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#263238" />
    </linearGradient>
    <linearGradient id="crown24kGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#B26A00" />
    </linearGradient>
    <linearGradient id="goldBezel24kGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="40%" stop-color="#FFD700" />
      <stop offset="80%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#FFF59D" />
    </linearGradient>
    <linearGradient id="auroraBorealisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="48%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#E040FB" />
    </linearGradient>
  </defs>

  <!-- CALQUE 1 : Ombre portée et extrusion 3D -->
  <g id="base-shadow">
    <ellipse cx="256" cy="476" rx="152" ry="24" fill="#2B1105" opacity="0.36" />
    <polygon points="256,42 460,246 256,450 52,246" fill="#2B1105" transform="translate(0, 16)" opacity="0.48" />
  </g>

  <!-- CALQUE 2 & 3 : Diamant Noir Ébène, Monture Or 24K, Aurore Boréale et Couronne -->
  <g id="main-body" stroke="#2B1105" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <!-- Cadre Losange Or 24K (Inspiration Place Vendôme) -->
    <polygon points="256,36 464,244 256,452 48,244" fill="url(#goldBezel24kGrad)" />

    <!-- Cœur Diamant Noir / Ébène -->
    <polygon points="256,74 426,244 256,414 86,244" fill="url(#blackDiamondGrad)" stroke-width="12" />

    <!-- Facettes géométriques internes du diamant noir -->
    <polygon points="256,74 426,244 256,244" fill="#1C2833" stroke="none" />
    <polygon points="256,244 426,244 256,414" fill="url(#ebonyFacetGrad)" stroke="none" />
    <line x1="256" y1="74" x2="256" y2="414" stroke="#37474F" stroke-width="4" />
    <line x1="86" y1="244" x2="426" y2="244" stroke="#37474F" stroke-width="4" />

    <!-- Ruban d'Aurore Boréale céleste sous le sommet du diamant -->
    <path d="M134 212 Q196 138 256 168 Q316 198 378 148 L396 174 Q322 232 256 198 Q194 168 116 234 Z" fill="url(#auroraBorealisGrad)" stroke-width="8" />

    <!-- Cimes Vendôme (Sommet noir et or en arrière-plan inférieur) -->
    <polygon points="142,300 218,214 256,256 304,202 370,300 256,414" fill="#0B1016" stroke="#FFD700" stroke-width="6" />

    <!-- Filet losange interne en Or 24K -->
    <polygon points="256,92 408,244 256,396 104,244" fill="none" stroke="#FFD700" stroke-width="6" />

    <!-- Couronne Royale Or 24K #FFD700 -->
    <path d="M158 310 L138 206 L202 248 L256 164 L310 248 L374 206 L354 310 Z" fill="url(#crown24kGrad)" stroke-width="14" />
    <!-- Bandeau bas de la couronne -->
    <rect x="154" y="302" width="204" height="32" rx="10" fill="url(#goldBezel24kGrad)" stroke-width="12" />

    <!-- Perles d'or aux pointes de la couronne -->
    <circle cx="136" cy="196" r="12" fill="#FFF9C4" stroke-width="9" />
    <circle cx="256" cy="152" r="15" fill="#FFF9C4" stroke-width="10" />
    <circle cx="376" cy="196" r="12" fill="#FFF9C4" stroke-width="9" />

    <!-- Joyaux sertis (Rubis, Émeraude, Saphir) -->
    <polygon points="256,246 272,268 256,290 240,268" fill="#FF1744" stroke-width="8" />
    <circle cx="194" cy="276" r="10" fill="#00E676" stroke-width="7" />
    <circle cx="318" cy="276" r="10" fill="#29B6F6" stroke-width="7" />
  </g>

  <!-- CALQUE 4 : Reflets spéculaires blancs nets (Hard-Edged) -->
  <g id="specular-highlights">
    <polygon points="256,54 272,70 92,250 74,236" fill="#FFFFFF" opacity="0.80" />
    <polygon points="256,104 268,116 132,252 118,242" fill="#FFFFFF" opacity="0.38" />
    <path d="M248 184 L222 238 L236 242 L256 196 Z" fill="#FFFFFF" opacity="0.88" />
    <rect x="168" y="310" width="64" height="8" rx="4" fill="#FFFFFF" opacity="0.85" />
    <circle cx="252" cy="148" r="5" fill="#FFFFFF" />
    <polygon points="206,126 212,140 226,146 212,152 206,166 200,152 186,146 200,140" fill="#FFFFFF" />
    <polygon points="326,118 330,128 340,132 330,136 326,146 322,136 312,132 322,128" fill="#FFFFFF" />
  </g>
</svg>
