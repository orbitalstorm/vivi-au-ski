name: vivi_au_ski
description: "VIVI AU SKI : Descente Royale 3D v1.1.0 — Simulation de ski 3D Cartoon Flutter (Android & iOS) à fort dénivelé mettant en scène les 4 modèles Vivienne (BLENDER_LAB : Speedy v03, Wonderland, Giant Denim, LV_NEO Blossom), banderoles LV_NEO, décors vivants et chute boule de neige."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sprites/
    - assets/turntable/
    - assets/cartoon/
